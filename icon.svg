<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="180" height="180" rx="40" fill="#2C3E50"/>
  
  <!-- Gewicht/Hantel Symbol -->
  <g transform="translate(90, 90)">
    <!-- Stange -->
    <rect x="-50" y="-5" width="100" height="10" fill="#ECF0F1"/>
    
    <!-- Linke Gewichte -->
    <rect x="-70" y="-20" width="20" height="40" rx="3" fill="#E74C3C"/>
    <rect x="-75" y="-15" width="5" height="30" rx="2" fill="#C0392B"/>
    
    <!-- Rechte Gewichte -->
    <rect x="50" y="-20" width="20" height="40" rx="3" fill="#E74C3C"/>
    <rect x="70" y="-15" width="5" height="30" rx="2" fill="#C0392B"/>
  </g>
  
  <!-- Text "LL" -->
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ECF0F1" text-anchor="middle">LIFT LOG</text>
</svg>
